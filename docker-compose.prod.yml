name: home-net-dashboard-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build:
      context: apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ROUTER_IP: ${ROUTER_IP:-10.40.43.100}
      NANO_IP: ${NANO_IP:-10.40.43.99}
      PROVIDER_IP: ${PROVIDER_IP:-10.40.43.125}
      INTERNET_IP: ${INTERNET_IP:-1.1.1.1}
      NANO_USERNAME: ${NANO_USERNAME:?Set NANO_USERNAME}
      NANO_PASSWORD: ${NANO_PASSWORD:?Set NANO_PASSWORD}
      # The Wavlink router's web UI, for the Devices page
      ROUTER_ADMIN_URL: ${ROUTER_ADMIN_URL:-http://192.168.20.1}
      ROUTER_PASSWORD: ${ROUTER_PASSWORD:?Set ROUTER_PASSWORD}
      CHECK_JOB_INTERVAL_SECONDS: ${CHECK_JOB_INTERVAL_SECONDS:-30}
      # A fast.com test every 10 minutes; 0 turns it off (tests then only run from the dashboard)
      SPEED_TEST_INTERVAL_SECONDS: ${SPEED_TEST_INTERVAL_SECONDS:-600}
      # How often each online device's speed is stored for its history and data used; 0 turns it off
      DEVICE_SAMPLE_INTERVAL_SECONDS: ${DEVICE_SAMPLE_INTERVAL_SECONDS:-10}
      # Bandwidth per day is cut at midnight in this timezone
      TZ: ${TZ:-America/Havana}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Lets the non-root user send ICMP echo through unprivileged datagram sockets
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    ports:
      - "${API_PORT:-3011}:3011"
    logging: *logging

volumes:
  postgres_data:
