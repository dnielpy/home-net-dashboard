name: home-net-dashboard-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    build:
      context: apps/api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ROUTER_IP: ${ROUTER_IP:-10.40.43.100}
      NANO_IP: ${NANO_IP:-10.40.43.99}
      PROVIDER_IP: ${PROVIDER_IP:-10.40.43.125}
      INTERNET_IP: ${INTERNET_IP:-1.1.1.1}
      NANO_USERNAME: ${NANO_USERNAME:?Set NANO_USERNAME}
      NANO_PASSWORD: ${NANO_PASSWORD:?Set NANO_PASSWORD}
      CHECK_JOB_INTERVAL_SECONDS: ${CHECK_JOB_INTERVAL_SECONDS:-30}
      # Bandwidth per day is cut at midnight in this timezone
      TZ: ${TZ:-America/Havana}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    # Lets the non-root user send ICMP echo through unprivileged datagram sockets
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    ports:
      - "${API_PORT:-3011}:3011"
    logging: *logging

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3011
      # Server-rendered dates and bandwidth buckets use the container's timezone
      TZ: ${TZ:-America/Havana}
    ports:
      - "${WEB_PORT:-3010}:3000"
    logging: *logging

volumes:
  postgres_data:
